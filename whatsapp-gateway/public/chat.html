<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#47184d">
    <title>WhatsApp Gateway - Messages</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #29232b;
            background: #f4f2f5;
        }
        button, input, textarea { font: inherit; }
        .app { display: flex; height: 100vh; }
        .sidebar {
            width: 350px;
            min-width: 300px;
            background: #fff;
            border-right: 1px solid #e8e3e9;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            background: #47184d;
            color: white;
        }
        .sidebar-header h1 { margin: 0 0 6px; font-size: 20px; }
        .sidebar-header p { margin: 0; font-size: 12px; opacity: .8; }
        .sidebar-tools { padding: 14px; border-bottom: 1px solid #eee; }
        .search {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #e5dfe7;
            border-radius: 8px;
            outline: none;
        }
        .search:focus { border-color: #762372; }
        .conversation-list { flex: 1; overflow-y: auto; }
        .conversation {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 14px;
            cursor: pointer;
            border-bottom: 1px solid #f1eef2;
        }
        .conversation:hover { background: #faf8fb; }
        .conversation.active { background: #f2eaf4; }
        .avatar {
            width: 46px;
            height: 46px;
            min-width: 46px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #762372;
            color: white;
            font-weight: bold;
        }
        .conversation-info { min-width: 0; flex: 1; }
        .conversation-top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }
        .conversation-name {
            font-weight: 600;
            font-size: 14px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .conversation-time { color: #999; font-size: 10px; white-space: nowrap; }
        .conversation-preview {
            color: #888;
            font-size: 12px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            height: 74px;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            border-bottom: 1px solid #e8e3e9;
        }
        .chat-header .avatar { width: 42px; height: 42px; min-width: 42px; }
        .chat-contact { flex: 1; min-width: 0; }
        .chat-contact strong { display: block; font-size: 15px; }
        .chat-contact span { color: #888; font-size: 12px; }
        .logout {
            padding: 9px 13px;
            color: #762372;
            background: white;
            border: 1px solid #762372;
            border-radius: 7px;
            cursor: pointer;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f5f2f5;
        }
        .bubble {
            max-width: min(72%, 650px);
            padding: 10px 13px 7px;
            border-radius: 11px;
            background: white;
            box-shadow: 0 1px 2px #0000000b;
            overflow-wrap: anywhere;
        }
        .bubble.outgoing {
            align-self: flex-end;
            background: #eee2f0;
        }
        .bubble.incoming { align-self: flex-start; }
        .bubble-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
        .bubble-meta {
            display: flex;
            justify-content: flex-end;
            gap: 7px;
            margin-top: 5px;
            color: #999;
            font-size: 10px;
        }
        .composer {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e8e3e9;
        }
        .composer textarea {
            flex: 1;
            min-width: 0;
            resize: none;
            max-height: 120px;
            padding: 12px;
            border: 1px solid #e2dce4;
            border-radius: 9px;
            outline: none;
        }
        .composer textarea:focus { border-color: #762372; }
        .send {
            padding: 0 22px;
            border: 0;
            border-radius: 9px;
            color: white;
            background: #762372;
            font-weight: bold;
            cursor: pointer;
        }
        .send:disabled { opacity: .5; cursor: wait; }
        .empty {
            margin: auto;
            text-align: center;
            color: #999;
            padding: 25px;
            line-height: 1.6;
        }
        .notice {
            display: none;
            padding: 10px 16px;
            color: #8b2525;
            background: #fff0f0;
            font-size: 13px;
        }
        .mobile-back { display: none; }
        @media (max-width: 700px) {
            .sidebar { width: 100%; min-width: 0; }
            .main { display: none; }
            .app.chat-open .sidebar { display: none; }
            .app.chat-open .main { display: flex; width: 100%; }
            .mobile-back {
                display: inline-block;
                border: 0;
                background: transparent;
                color: #762372;
                font-size: 22px;
                cursor: pointer;
            }
            .chat-header { padding: 10px 12px; }
            .messages { padding: 14px; }
            .bubble { max-width: 88%; }
            .composer { padding: 10px; }
            .send { padding: 0 15px; }
            .logout { padding: 8px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <aside class="sidebar">
        <header class="sidebar-header">
            <h1>WhatsApp Gateway</h1>
            <p id="accountStatus">Chargement du compte...</p>
        </header>
        <div class="sidebar-tools">
            <input class="search" id="search" type="search" placeholder="Rechercher une conversation...">
        </div>
        <div class="conversation-list" id="conversationList">
            <div class="empty">Chargement des conversations...</div>
        </div>
    </aside>

    <main class="main">
        <header class="chat-header">
            <button class="mobile-back" id="backButton" type="button" aria-label="Retour">‹</button>
            <div class="avatar" id="chatAvatar">W</div>
            <div class="chat-contact">
                <strong id="chatName">Sélectionnez une conversation</strong>
                <span id="chatNumber">Vos messages apparaîtront ici</span>
            </div>
            <button class="logout" id="logoutButton" type="button">Déconnexion</button>
        </header>

        <div class="notice" id="notice"></div>

        <section class="messages" id="messages">
            <div class="empty">Sélectionnez une conversation pour afficher les messages.</div>
        </section>

        <form class="composer" id="messageForm">
            <textarea id="messageInput" rows="1" placeholder="Écrire un message..." disabled></textarea>
            <button class="send" id="sendButton" type="submit" disabled>Envoyer</button>
        </form>
    </main>
</div>

<script>
(() => {
    const TOKEN_KEY = 'whatsapp_gateway_token';
    let token = sessionStorage.getItem(TOKEN_KEY);

    if (!token) {
        location.replace('/index.html');
        return;
    }

    const app = document.getElementById('app');
    const list = document.getElementById('conversationList');
    const messagesBox = document.getElementById('messages');
    const search = document.getElementById('search');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const messageForm = document.getElementById('messageForm');
    const notice = document.getElementById('notice');

    let conversations = [];
    let selectedConversation = null;
    let loadingMessages = false;
    let sending = false;

    function escapeText(value) {
        return String(value ?? '');
    }

    function conversationName(conversation) {
        return conversation.display_name ||
            conversation.push_name ||
            conversation.subject ||
            conversation.phone_number ||
            conversation.remote_jid ||
            'Conversation';
    }

    function initials(name) {
        return String(name).trim().slice(0, 1).toUpperCase() || '?';
    }

    function showNotice(text) {
        notice.textContent = text;
        notice.style.display = 'block';
    }

    function hideNotice() {
        notice.textContent = '';
        notice.style.display = 'none';
    }

    function logout() {
        sessionStorage.removeItem(TOKEN_KEY);
        location.replace('/index.html');
    }

    async function api(path, options = {}) {
        const response = await fetch(path, {
            ...options,
            headers: {
                Authorization: 'Bearer ' + token,
                'Content-Type': 'application/json',
                ...(options.headers || {})
            }
        });

        const result = await response.json().catch(() => ({}));

        if (response.status === 401) {
            logout();
            throw new Error('Session expirée.');
        }

        if (!response.ok || result.status === 'error') {
            throw new Error(result.message || 'Une erreur est survenue.');
        }

        return result;
    }

    function formatTime(value) {
        if (!value) return '';
        const date = new Date(String(value).replace(' ', 'T'));
        if (Number.isNaN(date.getTime())) return '';
        return date.toLocaleTimeString('fr-FR', {
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function renderConversations() {
        const query = search.value.trim().toLowerCase();

        const filtered = conversations.filter(conversation => {
            const searchable = [
                conversationName(conversation),
                conversation.phone_number,
                conversation.last_message_body
            ].join(' ').toLowerCase();

            return searchable.includes(query);
        });

        list.replaceChildren();

        if (filtered.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = conversations.length
                ? 'Aucune conversation ne correspond à votre recherche.'
                : 'Aucune conversation pour le moment. Les nouveaux échanges apparaîtront ici.';
            list.appendChild(empty);
            return;
        }

        filtered.forEach(conversation => {
            const item = document.createElement('div');
            item.className = 'conversation' +
                (selectedConversation?.id == conversation.id ? ' active' : '');

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = initials(conversationName(conversation));

            const info = document.createElement('div');
            info.className = 'conversation-info';

            const top = document.createElement('div');
            top.className = 'conversation-top';

            const name = document.createElement('div');
            name.className = 'conversation-name';
            name.textContent = conversationName(conversation);

            const time = document.createElement('div');
            time.className = 'conversation-time';
            time.textContent = formatTime(conversation.last_message_at);

            const preview = document.createElement('div');
            preview.className = 'conversation-preview';
            preview.textContent = (Number(conversation.last_message_from_me) === 1 ? 'Vous : ' : '') +
                (conversation.last_message_body || 'Aucun message');

            top.append(name, time);
            info.append(top, preview);
            item.append(avatar, info);

            item.addEventListener('click', () => selectConversation(conversation));
            list.appendChild(item);
        });
    }

    function renderMessages(messages, keepScroll = false) {
        const nearBottom = messagesBox.scrollHeight -
            messagesBox.scrollTop - messagesBox.clientHeight < 100;

        messagesBox.replaceChildren();

        if (!messages.length) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'Aucun message dans cette conversation.';
            messagesBox.appendChild(empty);
            return;
        }

        messages.forEach(message => {
            const bubble = document.createElement('article');
            bubble.className = 'bubble ' +
                (Number(message.from_me) === 1 ? 'outgoing' : 'incoming');

            const content = document.createElement('div');
            content.className = 'bubble-text';
            content.textContent = message.body ||
                '[' + (message.message_type || 'Message') + ']';

            const meta = document.createElement('div');
            meta.className = 'bubble-meta';

            const time = document.createElement('span');
            time.textContent = formatTime(message.sent_at);

            meta.appendChild(time);

            if (Number(message.from_me) === 1 && message.delivery_status) {
                const status = document.createElement('span');
                status.textContent = message.delivery_status;
                meta.appendChild(status);
            }

            bubble.append(content, meta);
            messagesBox.appendChild(bubble);
        });

        if (!keepScroll || nearBottom) {
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }
    }

    async function loadConversations() {
        const result = await api('/api/conversations');
        conversations = result.data?.conversations || [];
        renderConversations();

        if (selectedConversation) {
            const updated = conversations.find(c => c.id == selectedConversation.id);
            if (updated) selectedConversation = updated;
        }
    }

    async function loadMessages(keepScroll = true) {
        if (!selectedConversation || loadingMessages) return;

        loadingMessages = true;
        try {
            const result = await api(
                '/api/conversations/' + encodeURIComponent(selectedConversation.id) + '/messages?limit=100'
            );
            renderMessages(result.data?.messages || [], keepScroll);
        } finally {
            loadingMessages = false;
        }
    }

    async function selectConversation(conversation) {
        selectedConversation = conversation;
        app.classList.add('chat-open');

        const name = conversationName(conversation);
        document.getElementById('chatName').textContent = name;
        document.getElementById('chatNumber').textContent =
            conversation.phone_number || conversation.remote_jid || '';
        document.getElementById('chatAvatar').textContent = initials(name);

        messageInput.disabled = false;
        sendButton.disabled = false;

        renderConversations();
        messagesBox.innerHTML = '<div class="empty">Chargement des messages...</div>';

        try {
            await loadMessages(false);
            messageInput.focus();
        } catch (error) {
            showNotice(error.message);
        }
    }

    messageForm.addEventListener('submit', async event => {
        event.preventDefault();

        const text = messageInput.value.trim();
        if (!text || !selectedConversation || sending) return;

        sending = true;
        sendButton.disabled = true;
        hideNotice();

        try {
            await api(
                '/api/conversations/' + encodeURIComponent(selectedConversation.id) + '/messages',
                {
                    method: 'POST',
                    body: JSON.stringify({ text })
                }
            );

            messageInput.value = '';
            await loadMessages(false);
            await loadConversations();
            messageInput.focus();
        } catch (error) {
            showNotice(error.message);
        } finally {
            sending = false;
            sendButton.disabled = !selectedConversation;
        }
    });

    messageInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            messageForm.requestSubmit();
        }
    });

    search.addEventListener('input', renderConversations);

    document.getElementById('logoutButton').addEventListener('click', logout);

    document.getElementById('backButton').addEventListener('click', () => {
        app.classList.remove('chat-open');
    });

    async function initialize() {
        try {
            const status = await api('/api/whatsapp/status');
            if (status.data?.status !== 'connected') {
                location.replace('/index.html');
                return;
            }

            document.getElementById('accountStatus').textContent =
                status.data.phoneNumber
                    ? 'Connecté · ' + status.data.phoneNumber
                    : 'Compte WhatsApp connecté';

            await loadConversations();
        } catch (error) {
            showNotice(error.message);
        }
    }

    initialize();

    setInterval(async () => {
        try {
            await loadConversations();
            if (selectedConversation) {
                await loadMessages(true);
            }
        } catch (error) {
            showNotice(error.message);
        }
    }, 5000);
})();
</script>
</body>
</html>
