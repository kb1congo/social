
name: whatsapp-personal-gateway

services:
  nginx:
    image: nginx:1.28-alpine
    container_name: gateway-nginx
    restart: unless-stopped
    depends_on:
      - php
      - node
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gateway-php
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_KEY: ${APP_KEY:?Define APP_KEY in .env}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-whatsapp_gateway}
      DB_USERNAME: ${MYSQL_USER:-gateway}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}
      NODE_INTERNAL_URL: http://node:3000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Define INTERNAL_API_TOKEN in .env}
    volumes:
      - ./app:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  node:
    build:
      context: .
      dockerfile: whatsapp-service/Dockerfile
    container_name: gateway-node
    hostname: gateway-node
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      NODE_ENV: ${APP_ENV:-development}
      PORT: 3000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Define INTERNAL_API_TOKEN in .env}
      PHP_INTERNAL_URL: http://nginx
      WHATSAPP_CLIENT_ID: ${WHATSAPP_CLIENT_ID:-personal-gateway}
      WHATSAPP_DATA_PATH: /data/wwebjs
    volumes:
      - whatsapp_session:/data/wwebjs
    depends_on:
      - php
    networks:
      - backend
      - frontend

  mysql:
    image: mysql:8.4
    container_name: gateway-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-whatsapp_gateway}
      MYSQL_USER: ${MYSQL_USER:-gateway}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  whatsapp_session:
