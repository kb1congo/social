<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test TikTok - Safari 9</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        iframe {
            display: block;
            width: 100%;
            max-width: 400px;
            height: 650px;
            border: 0;
            margin: 15px auto;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h3>Test TikTok Embed Player</h3>

    <p id="status">Chargement du lecteur...</p>

    <iframe
        id="tiktok-player"
        src="https://www.tiktok.com/player/v1/6718335390845095173?controls=1&description=1"
        allowfullscreen>
    </iframe>

    <button id="play">Lire</button>
    <button id="pause">Pause</button>

    <script>
    (function () {

        var player = document.getElementById('tiktok-player');
        var status = document.getElementById('status');

        window.addEventListener('message', function (event) {

            if (event.origin !== 'https://www.tiktok.com') {
                return;
            }

            var data = event.data;

            if (typeof data === 'string') {
                try {
                    data = JSON.parse(data);
                } catch (e) {
                    return;
                }
            }

            if (!data || data['x-tiktok-player'] !== true) {
                return;
            }

            status.innerHTML = 'Événement reçu : ' + data.type;

        }, false);

        function sendCommand(type) {

            player.contentWindow.postMessage({
                type: type,
                value: undefined,
                'x-tiktok-player': true
            }, 'https://www.tiktok.com');

        }

        document.getElementById('play').onclick = function () {
            sendCommand('play');
        };

        document.getElementById('pause').onclick = function () {
            sendCommand('pause');
        };

    })();
    </script>

</body>
</html>
